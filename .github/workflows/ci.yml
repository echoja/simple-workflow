name: ci

on:
  push:
  pull_request:

  workflow_dispatch: {}
jobs:
  test:
    runs-on: echoja-simple-workflow-linux
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
